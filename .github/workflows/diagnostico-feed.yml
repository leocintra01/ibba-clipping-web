# Diagnostico temporario, criado em 23/11/2026 e para ser APAGADO depois de
# ler a saida. Existe por um motivo so': descobrir o que o runner do GitHub
# recebe quando pede o feed do IT Forum.
#
# O que a producao diz, em todo run de 18 a 23/11:
#     [PORTAL ERR] IT Forum (direto) | <unknown>:69:50: undefined entity
# Sempre na MESMA linha e coluna. Conteudo de feed muda de hora em hora;
# linha e coluna fixas sao pagina fixa. Da minha maquina o mesmo feed
# responde 200 com XML valido e 32 entradas, e o site esta' atras de
# Cloudflare — o que aponta para bloqueio de IP de datacenter, nao para
# feed quebrado.
#
# Este job roda em repositorio PUBLICO de proposito: nao gasta minuto da
# cota do Actions, e nao toca em Inoreader nenhum.
name: diagnostico-feed
on: workflow_dispatch

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: O que o runner recebe do IT Forum
        run: |
          set +e
          UA_PROJETO='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          for alvo in "https://itforum.com.br/feed/" "https://itforum.com.br/" "https://tiinside.com.br/feed/"; do
            echo "=============================================="
            echo "ALVO: $alvo"
            curl -s -D cab.txt -o corpo.txt -A "$UA_PROJETO" "$alvo" \
                 -w 'http=%{http_code} bytes=%{size_download} ct=%{content_type}\n'
            echo "--- cabecalhos que dizem se foi a Cloudflare:"
            grep -iE '^(HTTP/|server|cf-ray|cf-mitigated|cf-cache-status|content-type|retry-after)' cab.txt
            echo "--- linhas do corpo: $(wc -l < corpo.txt)"
            echo "--- linha 69, coluna 50 (onde a producao morre):"
            sed -n '69p' corpo.txt | cut -c1-160
            echo "--- primeiras 6 linhas:"
            head -6 corpo.txt | cut -c1-160
            echo "--- tem entidade de HTML fora de XML?"
            grep -o '&[a-zA-Z][a-zA-Z0-9]*;' corpo.txt | sort | uniq -c | sort -rn | head -5
          done
          echo "=============================================="
          echo "IP de saida deste runner:"
          curl -s https://api.ipify.org; echo
